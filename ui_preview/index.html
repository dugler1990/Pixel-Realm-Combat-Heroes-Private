<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Realm — UI preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@340;480;560&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Graphics/UI/kit/kit.css">
<style>
  /* Edit the look here. The frames stand in for the painted 9-slice kit. */
  :root {
    --ink: #0b0e12;
    --bone: #e6d3b0;
    --bone-dim: rgba(230, 211, 176, 0.38);
    --paper: rgba(10, 13, 18, 0.92);
    --text: #f4f1ea;
    --muted: #aeb6be;
    --blood: #8a3030;
    --display: "Cinzel", Georgia, serif;
    --body: "Outfit", "Segoe UI", sans-serif;
  }
  body[data-theme="vessel"] {
    --ink: #07080b;
    --bone: #c6a15a;
    --bone-dim: rgba(198, 161, 90, 0.46);
    --paper: rgba(8, 8, 10, 0.94);
    --text: #efe6d6;
    --muted: #9a907f;
    --blood: #7a2430;
    --display: "Cinzel", Georgia, serif;
  }
  body[data-theme="temple"] {
    --ink: #061014;
    --bone: #d4b36a;
    --bone-dim: rgba(212, 179, 106, 0.5);
    --paper: rgba(5, 14, 18, 0.94);
    --text: #e7f2f4;
    --muted: #8aa4a8;
    --blood: #1f6f78;
    --display: "Cinzel", Georgia, serif;
  }
  body[data-theme="covenant"] {
    --ink: #12080c;
    --bone: #e0c9a0;
    --bone-dim: rgba(224, 201, 160, 0.42);
    --paper: rgba(16, 7, 10, 0.94);
    --text: #f3e6d8;
    --muted: #b09a96;
    --blood: #8e2a2a;
    --display: "Cormorant Garamond", Georgia, serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); overflow: hidden; }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    font-family: var(--body);
    font-weight: 340;
    user-select: none;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

  .rail {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: #080a0d;
    border-bottom: 1px solid rgba(230, 211, 176, 0.16);
    flex-wrap: wrap;
  }
  .rail b {
    font-size: 11px;
    font-weight: 560;
    letter-spacing: 0.18em;
    color: var(--bone);
    margin-right: 8px;
  }
  .rail button {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .rail button.on { color: var(--text); background: rgba(230, 211, 176, 0.12); }
  .rail .spacer { flex: 1; }

  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  .fill { position: absolute; inset: 0; }
  .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(8,10,14,0.86) 0%, rgba(8,10,14,0.5) 38%, rgba(8,10,14,0.12) 72%);
  }
  .scrim.full { background: rgba(6, 8, 12, 0.72); }
  .scrim.death { background: rgba(12, 6, 6, 0.78); }

  .start-copy {
    position: relative;
    z-index: 1;
    padding: 9vh 0 0 8vw;
    width: min(440px, 86vw);
  }
  .kicker {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--bone);
  }
  h1 {
    margin: 10px 0 28px;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(56px, 7vw, 84px);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }
  h2 {
    margin: 0 0 18px;
    font-family: var(--display);
    font-weight: 500;
    font-size: 40px;
    line-height: 1;
  }
  .hint { margin-top: 28px; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; }

  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    padding: 11px 12px 11px 14px;
    border-left: 2px solid transparent;
    color: var(--muted);
    font-size: 20px;
    font-weight: 480;
    letter-spacing: 0.03em;
  }
  .item.on { border-left-color: var(--bone); color: var(--text); background: rgba(230, 211, 176, 0.06); }
  .item .val { color: var(--bone); font-size: 16px; }
  .item.on .val { color: var(--text); }
  .menu { width: min(360px, 100%); }

  .sheet {
    position: relative;
    z-index: 1;
    width: min(860px, calc(100% - 64px));
    margin: 48px auto;
    padding: 28px 32px 32px;
    background: var(--paper);
    border: 1px solid var(--bone-dim);
  }
  .center-menu {
    position: relative;
    z-index: 1;
    width: min(360px, calc(100% - 48px));
    margin: auto;
    padding: 28px 28px 22px;
    background: var(--paper);
    border: 1px solid var(--bone-dim);
  }
  .dim {
    position: absolute; inset: 0;
    display: flex;
    background: rgba(6, 8, 12, 0.72);
  }
  .dim .sheet, .dim .inv, .dim .center-menu {
    margin: auto;
    max-height: calc(100% - 36px);
    overflow: auto;
  }

  .player {
    display: grid;
    grid-template-columns: 280px 1fr 300px;
    height: 100%;
    gap: 18px;
    padding: 28px;
  }
  .roster, .stats {
    background: rgba(10, 13, 18, 0.72);
    border: 1px solid var(--bone-dim);
    padding: 16px;
    min-height: 0;
  }
  .stage-light {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 42%, #1c2632 0%, #0b0e12 68%);
    border: 1px solid rgba(230, 211, 176, 0.14);
    overflow: hidden;
  }
  .stage-light img {
    max-width: 92%;
    max-height: 92%;
    object-fit: contain;
    animation: rest 7s ease-in-out infinite;
  }
  @keyframes rest {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .who {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border-left: 2px solid transparent;
    color: var(--muted);
  }
  .who.on { border-left-color: var(--bone); color: var(--text); background: rgba(230, 211, 176, 0.06); }
  .who img { width: 54px; height: 54px; object-fit: cover; background: #111; }
  .who strong { display: block; font-weight: 480; font-size: 16px; }
  .who span { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
  .statline {
    display: flex;
    justify-content: space-between;
    padding: 7px 2px;
    border-bottom: 1px solid rgba(230, 211, 176, 0.12);
    font-size: 15px;
  }
  .statline b { font-weight: 480; color: var(--bone); }

  .levels { padding: 28px 36px 18px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .levels .hint { margin-top: 12px; }
  .cards {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 12px;
  }
  .card {
    position: relative;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    border: 1px solid rgba(230, 211, 176, 0.22);
    padding: 0;
    background: #111;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card span {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 22px 10px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,0.78));
    color: var(--text);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-align: left;
  }
  .card.on { outline: 2px solid var(--bone); outline-offset: -2px; }

  .addr {
    width: 100%;
    margin-top: 16px;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid var(--bone-dim);
    user-select: text;
  }
  .party { display: flex; gap: 12px; margin-bottom: 18px; }
  .slot {
    flex: 1;
    padding: 14px;
    border: 1px solid var(--bone-dim);
    min-height: 92px;
  }
  .slot em { display: block; font-style: normal; color: var(--muted); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .thumbs { display: flex; gap: 8px; margin: 8px 0 18px; }
  .thumbs button { width: 92px; height: 58px; padding: 0; border: 1px solid transparent; overflow: hidden; }
  .thumbs button.on { border-color: var(--bone); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .hud {
    position: absolute; inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 22px 24px;
  }
  .hp {
    width: 220px; height: 8px; margin-top: 8px;
    background: rgba(0,0,0,0.45);
    border: 1px solid var(--bone-dim);
  }
  .hp span { display: block; height: 100%; width: 72%; background: var(--blood); }
  .belt { display: flex; gap: 6px; }
  .slotbox, .cell {
    width: 58px; height: 48px;
    border: 0;
    background: rgba(8, 6, 4, .72);
    box-shadow: inset 0 0 0 1px #120e0a, inset 0 0 0 2px #8a7355;
    display: flex; align-items: flex-end; justify-content: flex-start;
    padding: 4px;
    font-size: 12px; letter-spacing: 0.04em; color: var(--bone);
  }
  .cell { width: 100%; height: 48px; }
  .worn-row .label { margin: 0; }
  .cell.empty, .slotbox.empty { color: transparent; }

  .fit, .center-menu, .roster, .stats, .sheet, .start-copy .menu {
    background-color: #1a120e;
    background-image:
      radial-gradient(circle at 14px 10px, #e6d3b0 1.4px, #6a543c 2.1px, transparent 2.6px),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>"),
      repeating-linear-gradient(90deg, rgba(255,220,170,.04) 0 1px, transparent 1px 5px),
      linear-gradient(165deg, #5a4332 0%, #3a281c 12%, #24180f 42%, #140e0b 100%);
    background-size: 26px 16px, 140px 140px, auto, auto;
    background-repeat: repeat-x, repeat, repeat, no-repeat;
    border: 3px solid #2a2118;
    box-shadow:
      inset 0 0 0 1px #0c0907,
      inset 0 0 0 6px #7d654c,
      inset 0 0 0 8px #1c140f,
      inset 0 18px 40px rgba(0,0,0,.35),
      0 16px 40px rgba(0,0,0,.45);
  }
  .fit {
    position: absolute;
    inset: 14px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 18px 18px 14px;
  }
  .fit::before, .center-menu::before, .roster::before, .stats::before, .sheet::before {
    content: "";
    position: absolute;
    inset: 8px;
    pointer-events: none;
    background:
      linear-gradient(#c6a15a, #c6a15a) left 10px top 10px / 18px 3px no-repeat,
      linear-gradient(#c6a15a, #c6a15a) left 10px top 10px / 3px 18px no-repeat,
      linear-gradient(#c6a15a, #c6a15a) right 10px top 10px / 18px 3px no-repeat,
      linear-gradient(#c6a15a, #c6a15a) right 10px top 10px / 3px 18px no-repeat,
      linear-gradient(#c6a15a, #c6a15a) left 10px bottom 10px / 18px 3px no-repeat,
      linear-gradient(#c6a15a, #c6a15a) left 10px bottom 10px / 3px 18px no-repeat,
      linear-gradient(#c6a15a, #c6a15a) right 10px bottom 10px / 18px 3px no-repeat,
      linear-gradient(#c6a15a, #c6a15a) right 10px bottom 10px / 3px 18px no-repeat;
  }
  .center-menu, .roster, .stats, .sheet { position: relative; }
  .dim .fit { inset: 14px; }
  .fit-head { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .fit h2 { margin: 0; font-size: 32px; }
  .fit-head .item { width: auto; }
  .dim .fit { overflow: hidden; }
  .gold { color: var(--bone); letter-spacing: 0.08em; }
  .inv-body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
    gap: 22px;
    align-items: stretch;
    overflow: hidden;
  }
  .doll-col { display: flex; flex-direction: column; align-items: center; min-height: 0; height: 100%; }
  .doll {
    position: relative;
    width: min(300px, 100%);
    flex: 1;
    min-height: 0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(90, 60, 36, .35), rgba(0,0,0,.45) 72%);
    box-shadow: inset 0 0 0 2px #5c4632, inset 0 0 0 5px #120e0b, inset 0 0 30px rgba(0,0,0,.55);
  }
  .mannequin {
    position: absolute;
    left: 50%;
    top: 4%;
    width: 74%;
    height: 92%;
    transform: translateX(-50%);
    object-fit: cover;
    object-position: center 18%;
    filter: drop-shadow(0 16px 12px rgba(0,0,0,.65));
    pointer-events: none;
  }
  .socket {
    position: absolute;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 2px;
    background: rgba(8, 6, 4, .42);
    color: var(--bone);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    box-shadow: inset 0 0 0 1px #1a120c, inset 0 0 0 2px #8a7355, 0 0 0 1px #1a120c;
  }
  .socket i { font-style: normal; color: var(--muted); font-size: 9px; }
  .socket b { font-weight: 480; background: rgba(0,0,0,.55); padding: 0 3px; }
  .socket.helm { width: 18%; height: 13%; left: 50%; top: 1%; transform: translateX(-50%); }
  .socket.glove.l { width: 12%; height: 10%; left: 14%; top: 34%; }
  .socket.glove.r { width: 12%; height: 10%; right: 14%; top: 34%; }
  .socket.armor { width: 26%; height: 14%; left: 50%; top: 40%; transform: translateX(-50%); }
  .socket.weapon.l { width: 13%; height: 24%; left: 2%; top: 50%; }
  .socket.weapon.r { width: 13%; height: 24%; right: 2%; top: 50%; }
  .socket.waist { width: 24%; height: 7%; left: 50%; top: 74%; transform: translateX(-50%); }
  .socket.boot.l { width: 16%; height: 9%; left: 28%; bottom: 3%; }
  .socket.boot.r { width: 16%; height: 9%; right: 28%; bottom: 3%; }
  .strap {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 10px;
    padding: 8px 12px;
    background: linear-gradient(#4a3424, #2a1c12);
    box-shadow: inset 0 0 0 2px #6a5340, inset 0 0 0 4px #140e0a;
  }
  .pack-col { align-self: stretch; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .bag {
    padding: 12px 12px 14px;
    background: rgba(0,0,0,.28);
    box-shadow: inset 0 0 0 2px #6a5340, inset 0 0 0 5px #140e0a, inset 0 0 24px rgba(0,0,0,.45);
  }
  .pack {
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(4, 62px);
    gap: 5px;
  }
  .pack .cell { width: 62px; height: 62px; }
  .belt-row { display: flex; gap: 6px; }
  .lobby-main, .create-main {
    flex: 1; min-height: 0;
    display: grid;
    gap: 14px;
    margin-top: 10px;
  }
  .lobby-main { grid-template-columns: 1.15fr 0.85fr; }
  .create-main { overflow: hidden; }
  .maps button { min-height: 0; height: 100%; }
  .seats { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .seat {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--bone-dim);
    padding: 0 12px;
    color: var(--muted);
  }
  .seat.you { color: var(--text); border-color: var(--bone); }
  .seat button { color: var(--bone); letter-spacing: 0.08em; font-size: 12px; }
  .board {
    display: flex; flex-direction: column; min-height: 0;
    border: 1px solid var(--bone-dim);
    padding: 8px 10px;
  }
  .log { flex: 1; min-height: 0; overflow: hidden; }
  .log p { margin: 0 0 6px; font-size: 14px; }
  .log b { font-weight: 480; color: var(--bone); }
  .gamelist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  .game {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1.4fr 0.7fr 1fr auto;
    gap: 8px;
    align-items: center;
    width: 100%;
    border: 1px solid transparent;
    border-left: 2px solid transparent;
    padding: 0 12px;
    color: var(--muted);
  }
  .game.on { border-color: var(--bone-dim); border-left-color: var(--bone); color: var(--text); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices button, .mini {
    border: 1px solid var(--bone-dim);
    padding: 8px 12px;
    color: var(--muted);
  }
  .choices button.on, .mini.on { border-color: var(--bone); color: var(--text); }
  .create-main { grid-template-columns: 1.1fr 0.9fr; }
  .maps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    min-height: 0;
    height: 100%;
  }
  .maps button { padding: 0; border: 1px solid transparent; overflow: hidden; min-height: 0; }
  .maps button.on { border-color: var(--bone); }
  .maps img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .advanced { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .advanced .addr { flex: 1; min-width: 140px; margin-top: 0; }
  .map-col { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .label { margin-bottom: 6px; }
  body[data-theme="vessel"] .fit,
  body[data-theme="vessel"] .center-menu,
  body[data-theme="vessel"] .roster,
  body[data-theme="vessel"] .stats,
  body[data-theme="vessel"] .sheet {
    box-shadow: inset 0 0 0 1px rgba(198, 161, 90, 0.18);
  }
  body[data-theme="temple"] .fit,
  body[data-theme="temple"] .center-menu,
  body[data-theme="temple"] .roster,
  body[data-theme="temple"] .stats,
  body[data-theme="temple"] .sheet,
  body[data-theme="temple"] .stage-light {
    outline: 1px solid rgba(212, 179, 106, 0.45);
    outline-offset: 4px;
  }
  body[data-theme="covenant"] .fit,
  body[data-theme="covenant"] .center-menu,
  body[data-theme="covenant"] .sheet { border-left: 3px solid var(--blood); }
  .turntable-note {
    position: absolute; left: 0; right: 0; bottom: 12px;
    text-align: center; letter-spacing: 0.18em; font-size: 11px; color: var(--bone);
  }
  .upgrade-grid { display: grid; grid-template-columns: minmax(180px, 34%) 1fr; gap: 16px; height: 100%; min-height: 0; }
  .upgrade-grid .stage-light { position: relative; min-height: 0; }
  .label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

  .map-sheet {
    width: calc(100% - 40px);
    height: calc(100% - 40px);
    margin: auto;
    border: 1px solid var(--bone-dim);
    overflow: hidden;
    cursor: grab;
    background: #07090c;
    position: relative;
  }
  .map-world { position: absolute; inset: 0; transform-origin: center center; }
  .map-world img { width: 100%; height: 100%; object-fit: cover; }
  .pin {
    position: absolute; left: 48%; top: 56%;
    width: 12px; height: 12px; margin: -6px;
    border: 2px solid var(--bone);
    border-radius: 50%;
    background: #c46a4a;
  }
  .map-note {
    position: absolute; left: 12px; bottom: 10px;
    color: var(--bone); font-size: 12px; letter-spacing: 0.12em;
  }

  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar { height: 8px; background: rgba(255,255,255,0.08); margin-top: 6px; }
  .bar span { display: block; height: 100%; background: var(--bone); }
  .spend {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 16px;
    width: 100%;
    padding: 8px 10px 10px;
    border-left: 2px solid transparent;
    color: var(--muted);
  }
  .spend .bar { grid-column: 1 / -1; margin-top: 0; }
  .spend.on { border-left-color: var(--bone); color: var(--text); background: rgba(230, 211, 176, 0.06); }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; height: 100%; padding: 28px 36px; }
  .portrait-col { display: flex; flex-direction: column; min-height: 0; }
  .portrait-col .stage-light { flex: 1; }

  .doors {
    position: absolute;
    z-index: 40;
    left: 0; right: 0; bottom: 0;
    top: 38px;
    display: flex;
    pointer-events: none;
  }
  .doors:not(.open) { pointer-events: auto; }
  .door {
    width: 50%;
    height: 100%;
    position: relative;
    transition: transform 1.05s cubic-bezier(.16, .84, .32, 1);
    background:
      linear-gradient(#6b5340, #6b5340) 0 18% / 100% 7px no-repeat,

function visibleGames() {
  const q = state.query.trim().toLowerCase();
  return games.filter((g) => !q || (g.name + " " + g.mode).toLowerCase().includes(q));
}
function partyMeta() {
  if (state.mpMode === "join") return games[state.joined] || games[0];
  return { name: state.gameName, mode: modes[state.mode], map: state.level, seats: state.seats, filled: 1 };
}
function partySlots() {
  const meta = partyMeta();
  const others = ["Ash", "Mara", "Isk", "Nim", "Sol"];
  const extra = state.mpMode === "join" ? Math.max(0, meta.filled - 1) : 0;
  const slots = [{ name: hero().name, you: true, ready: state.ready }];
  for (let i = 0; i < extra; i++) slots.push({ name: others[i], ready: i % 2 === 0 });
  while (slots.length < meta.seats) slots.push({ open: true });
  return slots;
}
function hero() { return characters[state.character]; }

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function on(i) { return i === state.selected ? " on" : ""; }

  if (state.statsFor === state.character) return;
  state.statsFor = state.character;
  state.stats = Object.assign({}, hero().stats);
  state.points = 10;
}

  if (state.screen === "death") return "death";
  if (state.screen === "world" && state.pause) return state.pause;
  return state.screen;
}

let doorsBusy = false;
function withDoors(apply) {
  const doors = document.getElementById("doors");
  if (!doors || doorsBusy) { apply(); return; }
  doorsBusy = true;
  doors.classList.remove("open");
  setTimeout(() => {
    // The leaves have met: they slam, then hold long enough for the seal to kindle.
    doors.classList.add("shut");
    apply();
    setTimeout(() => {
      doors.classList.remove("shut");
      doors.classList.add("open");
      setTimeout(() => { doorsBusy = false; }, 1100);
    }, 480);
  }, 860);
}

// The chosen level's picture grows until it fills the screen, then the world takes over.
function growInto(card) {
  if (document.querySelector(".grow")) return;
  const box = (r) => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  const pic = card.querySelector("img").cloneNode();
  pic.className = "grow";
  Object.assign(pic.style, box(card.getBoundingClientRect()));
  document.body.appendChild(pic);
  const stage = document.getElementById("stage").getBoundingClientRect();
  pic.animate([box(card.getBoundingClientRect()), box(stage)], { duration: 750, easing: "cubic-bezier(.6, 0, .2, 1)", fill: "forwards" })
    .finished.then(() => {
      state.screen = "world";
      state.pause = null;
      state.selected = 0;
      render();
      pic.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: "forwards" }).finished.then(() => pic.remove());
    });
}

function go(screen) {
  withDoors(() => {
    state.screen = screen;
    state.pause = null;
    state.selected = 0;
    if (screen === "attributes") ensureStats();
    render();
  });
}

function jump(name) {
  withDoors(() => {
    state.selected = 0;
    state.pause = null;
    if (name === "pause") { state.screen = "world"; state.pause = "root"; }
    else if (name === "inventory" || name === "map" || name === "upgrade") { state.screen = "world"; state.pause = name; }
    else state.screen = name;
    if (name === "attributes" || state.pause === "attributes") ensureStats();
    render();
  });
}

  const val = value == null ? "" : `<span class="val">${esc(value)}</span>`;
  return `<button class="item${on(i)}" data-i="${i}"><span>${esc(label)}</span>${val}</button>`;
}

  else if (i === 3) s.fps = dir > 0 ? (s.fps === 30 ? 60 : 120) : (s.fps === 120 ? 60 : 30);
  else if (i === 4) s.debug = !s.debug;
  else if (i === 5) s.outlines = !s.outlines;
  else if (i === 6) s.gold = !s.gold;
}

function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

// Legion backdrops. Rain only falls outdoors; torches are flame and wet-stone reflection

function rainTile(w, h, count, len, width, color, blur, seed, faintest = 0.35) {
  let s = seed;
  const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let drops = "";
  for (let n = 0; n < count; n++) {
    const x = (rand() * w).toFixed(1);
    const y = rand() * h;
    const l = len * (0.6 + rand() * 0.8);
    const a = (faintest + rand() * (1 - faintest)).toFixed(2);
    // A drop that runs off the bottom is drawn again at the top, so the tile repeats cleanly.
    for (const top of [y, y - h]) drops += `<line x1='${x}' y1='${top.toFixed(1)}' x2='${x}' y2='${(top + l).toFixed(1)}' stroke-opacity='${a}'/>`;
  }
  const soft = blur ? `<filter id='b'><feGaussianBlur stdDeviation='${blur}'/></filter>` : "";
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>${soft}<g stroke='${color}' stroke-width='${width}' stroke-linecap='round'${blur ? " filter='url(#b)'" : ""}>${drops}</g></svg>`;
  return `url("data:image/svg+xml;utf8,${svg.replace(/#/g, "%23")}")`;
}
const rootStyle = document.documentElement.style;
rootStyle.setProperty("--rain-far", rainTile(180, 360, 60, 16, 0.9, "rgb(190,206,222)", 0.7, 7));
rootStyle.setProperty("--rain-near", rainTile(420, 640, 8, 52, 1.3, "rgb(228,236,244)", 0, 11));
// The same drops again, lit: full strength so they cover the cold drop underneath.
rootStyle.setProperty("--rain-warm", rainTile(420, 640, 8, 52, 1.7, "rgb(255,150,60)", 0, 11, 1));
rootStyle.setProperty("--rain-far-warm", rainTile(180, 360, 60, 16, 1.1, "rgb(255,140,50)", 0.7, 7, 1));

function backdrop(kind) {
  if (state.theme === "legion") {
    const scene = scenes[kind] || scenes.start;
    const lights = (scene.torches || [])
      .map(([x, y]) => `radial-gradient(ellipse 11% 24% at ${x}% ${y}%, #000, rgba(0,0,0,.6) 35%, transparent)`)
      .join(", ");
    const warm = lights ? `<div class="warm" style="--lights: ${lights}"><i class="far"></i><i class="near"></i></div>` : "";
    const rain = scene.rain ? `<div class="rain"><i class="far"></i><i class="near"></i>${warm}</div>` : "";
    const standing = kind === "shrine" ? heroFigure() : "";
    return `<div class="scene"><img class="bg" src="${scene.file}" alt="">${standing}${rain}</div>`;
  }
  if (state.theme === "citadel") {
    const file = {
      start: "assets/hall.jpg",
      mp: "../Graphics/UI/backdrops/warroom.jpg",
      world: "../Graphics/UI/backdrops/field.jpg",
      shrine: "../Graphics/UI/backdrops/shrine.jpg"
    }[kind] || "assets/hall.jpg";
    return `<img class="bg" src="${file}" alt="">`;
  }
  const map = kind === "start" ? "1_4.png" : kind === "mp" ? "2_3.png" : land().file;
  return `<img class="bg" src="${img(map)}" alt="">`;
}

function figureSrc(c) { return state.theme === "legion" ? c.full : c.img; }

function statIcon(key) {
  return state.theme === "legion" ? `<img class="icon" src="../Graphics/UI/kit/icon_${key}.png" alt="">` : "";
}

function heroFigure() {
  return `<div class="hero"><i class="floor"></i><img src="${figureSrc(hero())}" alt=""></div>`;
}

// Legion shows an item as its painted mark; empty slots stay empty.
function itemMark(name) {
  if (!name) return ".";
  if (state.theme !== "legion") return esc(name);
  return `<img class="mark" src="../Graphics/UI/kit/${name.toLowerCase()}.png" alt="${esc(name)}" title="${esc(name)}">`;
}

function worldLayer(overlayClass) {
  const frame = overlayClass === "center-menu" ? overlayClass : `fit ${overlayClass}`;
  return `
    ${backdrop("world")}
    <div class="dim"><div class="${frame}">`;
}

function closeWorld() { return `</div></div>`; }

function figure() {
  if (state.theme !== "legion") return `<img class="mannequin" src="${hero().img}" alt="">`;
  return `<img class="doll-figure" src="../Graphics/UI/kit/doll.png" alt="">`;
}

function attributesBlock() {
  ensureStats();
  const rows = spendKeys.map((key, i) => {
    return `<button class="spend${on(i)}" data-i="${i}">${statIcon(key)}<span>${esc(cap(key))}</span><b>${state.stats[key]}</b></button>`;
  }).join("");
  const ready = state.points === 0 ? "Ready" : state.points + " points left";
  const readyRow = state.pause ? "" : item(spendKeys.length, ready);
  return `
    <p class="kicker">Attributes</p>
    <h2>${esc(hero().name)}</h2>
    ${rows}
    ${readyRow}
    <p class="hint">Left and right spend a point. Esc steps back.</p>`;
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function nav() {
  const a = active();
  if (a === "start") return { n: 3, cols: 1 };
  if (a === "settings") return { n: 7, cols: 1 };
  if (a === "mp") return { n: visibleGames().length + 1, cols: 1 };
  if (a === "create") return { n: 2, cols: 1 };
  if (a === "player") return { n: 3, cols: 1 };
  if (a === "attributes") return { n: state.pause ? 5 : 6, cols: 1 };
  if (a === "levels") return { n: levels.length, cols: 4 };
  if (a === "lobby") return { n: 2, cols: 1 };
  if (a === "root") return { n: 8, cols: 1 };
  if (a === "attacks") return { n: hero().loadout.length, cols: 1 };
  if (a === "upgrade") return { n: upgradeKeys.length, cols: 1 };
  if (a === "death") return { n: 3, cols: 1 };
  return null;
}

function move(key) {
  const info = nav();
  if (!info) return;
  let i = state.selected;
  if (key === "ArrowRight" && info.cols > 1) i = Math.min(info.n - 1, i + 1);
  else if (key === "ArrowLeft" && info.cols > 1) i = Math.max(0, i - 1);
  else if (key === "ArrowDown") i = Math.min(info.n - 1, i + info.cols);
  else if (key === "ArrowUp") i = Math.max(0, i - info.cols);
  else return;
  state.selected = i;
  if (active() === "levels") state.level = i;
  if (active() === "player") state.character = i;
  render();
}

function spend(dir) {
  ensureStats();
  const key = spendKeys[state.selected];
  if (!key) return;
  if (dir > 0 && state.points > 0) { state.stats[key] += 1; state.points -= 1; }
  if (dir < 0 && state.stats[key] > hero().stats[key]) { state.stats[key] -= 1; state.points += 1; }
  render();
}

function activate() {
  const a = active();
  const i = state.selected;
  if (a === "start") {
    if (i === 0) { state.mpMode = null; go("player"); }
    else if (i === 1) go("mp");
    else go("settings");
  } else if (a === "mp") {
    const shown = visibleGames();
    if (i >= shown.length) go("create");
    else { state.joined = games.indexOf(shown[i]); state.mpMode = "join"; go("lobby"); }
  } else if (a === "create") {
    if (i === 0) { state.advanced = !state.advanced; render(); }
    else { state.mpMode = "host"; go("lobby"); }
  } else if (a === "player") {
    state.character = i;
    if (state.mpMode) go("lobby");
    else go("attributes");
  } else if (a === "attributes") {
    if (!state.pause && i === spendKeys.length && state.points === 0) go("levels");
    else spend(1);
  } else if (a === "levels") {
    state.level = i;
    const card = document.querySelector(`.card[data-i="${i}"]`);
    if (card) growInto(card);
    else go("world");
  } else if (a === "lobby") {
    if (i === 0) { state.ready = !state.ready; render(); }
    else if (state.ready) go("world");
  } else if (a === "root") {
    const pages = [null, "inventory", "map", "attributes", "attacks", "upgrade", "settings"];
    if (i === 0) { state.pause = null; render(); }
    else if (i === 7) go("start");
    else withDoors(() => { state.pause = pages[i]; state.selected = 0; if (state.pause === "attributes") ensureStats(); render(); });
  } else if (a === "upgrade") {
    const u = upgradeKeys[i];
    const cost = state.costs[u.key];
    if (state.exp >= cost && state.upgrade[u.key] < u.max) {
      state.exp -= cost;
      state.upgrade[u.key] = Math.min(u.max, state.upgrade[u.key] * 1.2);
      state.costs[u.key] = Math.round(cost * 1.4);
      render();
    }
  } else if (a === "settings") {
    stepSetting(1);
    render();
  } else if (a === "death") {
    if (i === 0) go("world");
    else go("start");
  }
}

function back() {
  const a = active();
  if (state.pause && state.pause !== "root") { state.pause = "root"; state.selected = 0; render(); return; }
  if (state.pause === "root") { state.pause = null; render(); return; }
  const prev = {
    settings: "start",
    mp: "start",
    player: state.mpMode ? "lobby" : "start",
    attributes: "player",
    levels: "attributes",
    create: "mp",
    lobby: "mp",
    world: "pause-open",
    death: "world"
  }[a];
  if (prev === "pause-open") { state.screen = "world"; state.pause = "root"; state.selected = 0; render(); }
  else if (prev) go(prev);
}

function bind() {
  document.querySelectorAll("[data-i]").forEach((el) => {
    el.addEventListener("mouseenter", () => {
      const i = Number(el.dataset.i);
      if (i === state.selected) return;
      state.selected = i;
      if (active() === "player") state.character = i;
      if (active() === "levels") state.level = i;
      document.querySelectorAll("[data-i]").forEach((n) => n.classList.toggle("on", Number(n.dataset.i) === i));
      const title = document.querySelector(".levels h2");
      if (title && active() === "levels") title.textContent = land().name;
      const kicker = document.querySelector(".levels .kicker");
      if (kicker && active() === "levels") kicker.textContent = "Level " + land().id;
      if (active() === "player") {
        const h = hero();
        const name = document.querySelector(".stats h2");
        if (name) name.textContent = h.name;
        const imgEl = document.querySelector(".stage-light img");
        if (imgEl) imgEl.src = h.img;
        const standing = document.querySelector(".hero");
        if (standing) standing.outerHTML = heroFigure();
        const lines = document.querySelectorAll(".statline b");
        ["health", "energy", "attack", "magic", "speed", "strength", "vitality", "agility", "charisma"]
          .forEach((k, n) => { if (lines[n]) lines[n].textContent = h.stats[k]; });
      }
    });
    el.addEventListener("click", () => {
      state.selected = Number(el.dataset.i);
      if (active() === "levels") {
        state.level = state.selected;
        const title = document.querySelector(".levels h2");
        if (title) title.textContent = land().name;
        const kicker = document.querySelector(".levels .kicker");
        if (kicker) kicker.textContent = "Level " + land().id;
        document.querySelectorAll("[data-i]").forEach((n) => n.classList.toggle("on", Number(n.dataset.i) === state.selected));
        return;
      }
      activate();
    });
  });
  document.querySelectorAll("[data-level]").forEach((el) => {
    el.addEventListener("click", () => {
      state.level = Number(el.dataset.level);
      render();
    });
  });
  document.querySelectorAll("[data-mode]").forEach((el) => {
    el.addEventListener("click", () => { state.mode = Number(el.dataset.mode); render(); });
  });
  document.querySelectorAll("[data-seats]").forEach((el) => {
    el.addEventListener("click", () => { state.seats = Number(el.dataset.seats); render(); });
  });
  document.querySelectorAll("[data-privacy]").forEach((el) => {
    el.addEventListener("click", () => { state.privacy = el.dataset.privacy; render(); });
  });
  document.querySelectorAll("[data-flag]").forEach((el) => {
    el.addEventListener("click", () => {
      state[el.dataset.flag] = !state[el.dataset.flag];
      render();
    });
  });
  const change = document.querySelector("[data-change]");
  if (change) change.addEventListener("click", () => go("player"));
  const keep = (id, key) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", () => {
      state[key] = el.value;
      if (id !== "q") return;
      const pos = el.selectionStart;
      render();
      const again = document.getElementById("q");
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    });
  };
  keep("q", "query");
  keep("gname", "gameName");
  keep("pw", "password");
  keep("say", "draft");
  const view = document.getElementById("map-view");
  const world = document.getElementById("map-world");
  if (view && world) {
    const apply = () => { world.style.transform = `translate(${state.map.x}px, ${state.map.y}px) scale(${state.map.s})`; };
    apply();
    view.addEventListener("wheel", (e) => {
      e.preventDefault();
      state.map.s = clamp(state.map.s * (e.deltaY < 0 ? 1.08 : 0.92), 1, 4);
      apply();
    }, { passive: false });
    let drag = null;
    view.addEventListener("pointerdown", (e) => {
      drag = { x: e.clientX, y: e.clientY, ox: state.map.x, oy: state.map.y };
      view.setPointerCapture(e.pointerId);
    });
    view.addEventListener("pointermove", (e) => {
      if (!drag) return;
      state.map.x = drag.ox + e.clientX - drag.x;
      state.map.y = drag.oy + e.clientY - drag.y;
      apply();
    });
    view.addEventListener("pointerup", () => { drag = null; });
  }
}

function renderRail() {
  const a = active();
  document.body.dataset.theme = state.theme;
  const screens = jumps.map(([label, name]) => {
    const here = name === a || (name === "pause" && a === "root") || (name === "settings" && a === "settings");
    return `<button data-jump="${name}" class="${here ? "on" : ""}">${label}</button>`;
  }).join("");
  const looks = themes.map(([id, label]) => `<button data-look="${id}" class="${state.theme === id ? "on" : ""}">${label}</button>`).join("");
  document.getElementById("rail").innerHTML = `<b>PREVIEW</b>${screens}<span class="spacer"></span><b>LOOK</b>${looks}`;
  document.querySelectorAll("[data-jump]").forEach((el) => {
    el.addEventListener("click", () => jump(el.dataset.jump));
  });
  document.querySelectorAll("[data-look]").forEach((el) => {
    el.addEventListener("click", () => { state.theme = el.dataset.look; render(); });
  });
}

function render() {
  if (state.selected < 0) state.selected = 0;
  const info = nav();
  if (info && state.selected > info.n - 1) state.selected = info.n - 1;
  // Rain is rebuilt with the screen; a delay of minus the clock keeps it falling without a jump.
  document.body.style.setProperty("--now", (-performance.now() / 1000).toFixed(3) + "s");
  document.getElementById("stage").innerHTML = view();
  bind();
  renderRail();
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") {
    if (e.target.id === "say" && e.key === "Enter") {
      e.preventDefault();
      const v = e.target.value.trim();
      if (v) state.chat.push(["You", v]);
      state.draft = "";
      render();
      return;
    }
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter", "Escape"].includes(e.key)) e.preventDefault();
  const a = active();
  if (e.key === "Escape") { back(); return; }
  if (a === "world") return;
  if ((a === "settings") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    stepSetting(e.key === "ArrowRight" ? 1 : -1);
    render();
    return;
  }
  if (a === "attributes" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { spend(e.key === "ArrowRight" ? 1 : -1); return; }
  if (a === "create" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    state.mode = (state.mode + (e.key === "ArrowRight" ? 1 : 2)) % 3;
    render();
    return;
  }
  if (e.key === "Enter" || e.key === " ") {
    const pressed = document.querySelector("#stage [data-i].on");
    if (pressed) pressed.classList.add("down");
    activate();
    return;
  }
  move(e.key);
});
document.addEventListener("keyup", () => {
  document.querySelectorAll(".down").forEach((n) => n.classList.remove("down"));
});

render();
</script>
</body>
</html>
