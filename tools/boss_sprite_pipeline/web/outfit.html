<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outfits</title>
<style>
  :root { --bg:#16181d; --panel:#1f2229; --line:#2e333d; --text:#e4e6ea; --dim:#9aa1ad; --ok:#4caf7a; --gate:#e0a33a;
          --bad:#e05a5a; --run:#4a90d9; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:18px; align-items:center; padding:8px 14px; background:var(--panel);
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { color:var(--dim); font-weight:600; margin-right:4px; }
  .key { padding:2px 8px; border-radius:10px; border:1px solid var(--line); }
  .key.on { border-color:var(--ok); color:var(--ok); } .key.off { color:var(--dim); }
  button { background:#2b303a; color:var(--text); border:1px solid #3a404c; border-radius:5px; padding:4px 10px;
           cursor:pointer; font:inherit; }
  button:hover { background:#353b47; } button.main { background:#2d5d93; border-color:#3a72b0; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=text] { background:#12141a; color:var(--text); border:1px solid var(--line); border-radius:5px;
                     padding:4px 8px; font:inherit; }
  #stop { display:none; background:var(--bad); color:#fff; font-weight:700; padding:4px 12px; border-radius:5px; }
  main { display:grid; grid-template-columns:270px 1fr; min-height:calc(100vh - 48px); }
  nav { border-right:1px solid var(--line); padding:10px; overflow:auto; }
  .outfit { padding:8px; border-radius:6px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; }
  .outfit:hover { background:var(--panel); } .outfit.sel { border-color:var(--run); background:var(--panel); }
  .outfit .name { font-weight:600; } .outfit .kind { color:var(--dim); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; margin-top:5px; }
  .chip { font-size:11px; padding:1px 6px; border-radius:8px; background:#2a2e36; color:var(--dim); cursor:pointer; }
  .chip.done { background:#1f3b2c; color:var(--ok); } .chip.gate { background:#3d3020; color:var(--gate); }
  .chip.skipped { background:#24272d; color:#6c727c; text-decoration:line-through; }
  .chip.missing, .chip.failed { background:#3d2224; color:var(--bad); }
  .chip.redo { background:#3a2a3d; color:#d38ad9; }
  .chip.running { background:#1e3248; color:var(--run); } .chip.sel { outline:1px solid var(--text); }
  section { padding:12px 16px; overflow:auto; }
  h2 { margin:0 0 4px; font-size:18px; } h3 { margin:14px 0 6px; font-size:15px; }
  .dim { color:var(--dim); } .err { color:var(--bad); } .okc { color:var(--ok); } .gatec { color:var(--gate); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .attempt { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; margin:8px 0; }
  .attempt.acc { border-color:var(--ok); }
  .attempt img, .big { max-width:100%; border-radius:4px; background:#fff; display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px; }
  .grid img { width:100%; background:#fff; border-radius:4px; }
  pre { background:#0f1115; border:1px solid var(--line); border-radius:6px; padding:8px; max-height:340px;
        overflow:auto; font:12px/1.35 Consolas, monospace; white-space:pre-wrap; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center;
              justify-content:center; z-index:9; cursor:zoom-out; }
  .lightbox img { max-width:96vw; max-height:96vh; background:#fff; }
  img.zoom { cursor:zoom-in; }
  img.thumb { max-height:120px; background:#fff; border-radius:4px; }
  .char { border-top:1px solid var(--line); padding-top:8px; margin-top:8px; }
  .char > .row b { cursor:pointer; font-size:15px; } .char > .row b:hover { text-decoration:underline; }
  .tag { font-size:11px; padding:1px 7px; border-radius:8px; border:1px solid var(--line); color:var(--dim); }
  .phases { display:flex; flex-wrap:wrap; gap:3px; margin-top:5px; }
  .ph { font-size:11px; padding:1px 6px; border-radius:8px; background:#2a2e36; color:var(--dim); }
  .ph.done { background:#1f3b2c; color:var(--ok); } .ph.gate { background:#3d3020; color:var(--gate); }
  .ph.running { background:#1e3248; color:var(--run); } .ph.bad { background:#3d2224; color:var(--bad); }
  .phase { display:inline-block; vertical-align:top; margin:0 14px 8px 0; }
  .phase > .dim { font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .kinds { display:flex; gap:8px; flex-wrap:wrap; }
  .kindcard { border:1px solid var(--line); border-radius:8px; padding:8px; width:260px; cursor:pointer; }
  .kindcard.sel { border-color:var(--run); background:#1e2a3a; } .kindcard:hover { background:var(--panel); }
  h4 { margin:16px 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  table.tbl { border-collapse:collapse; } table.tbl td, table.tbl th { padding:3px 10px 3px 0; text-align:left;
    border-bottom:1px solid var(--line); vertical-align:top; }
  .slots { display:flex; flex-wrap:wrap; gap:10px; }
  .slot { border:1px solid var(--line); border-radius:6px; padding:6px; width:230px; }
  #toast { position:fixed; right:16px; bottom:16px; background:var(--bad); color:#fff; padding:10px 14px;
           border-radius:6px; display:none; max-width:520px; white-space:pre-wrap; z-index:10; }
</style>
</head>
<body>
<header>
  <span><b>Keys</b><span id="keys"></span></span>
  <span><b>Pod</b><input id="podline" type="text" size="44" placeholder="paste RunPod's ssh line (…@ssh.runpod.io)">
    <button onclick="setPod()">Set</button> <span id="podinfo" class="dim">no pod</span></span>
  <span id="stop">stop the pod</span>
</header>
<main>
  <nav id="nav"></nav>
  <section id="main"><p class="dim">Pick a character or an outfit on the left.</p></section>
</main>
<div class="lightbox" id="lb" onclick="this.style.display='none'"><img id="lbimg"></div>
<div id="toast" onclick="this.style.display='none'"></div>
<script>
const S = { state:null, sel:null, step:null, detail:null, detailAt:0, logStep:null };
const POD_STEPS = new Set(["trellis", "sam3", "holopart"]);
const LABEL = { front_only:"front only", front_back:"front + back", front_back_sides:"front + back + sides",
                eight_views:"8 views (front, back, sides, 3/4s)" };

function kindName(k) { return S.fields && S.fields.kind_ui[k] ? S.fields.kind_ui[k][0] : k; }
function stepName(s) { return S.fields && S.fields.step_ui[s] ? S.fields.step_ui[s][0] : s; }
function stepHelp(s) { return S.fields && S.fields.step_ui[s] ? S.fields.step_ui[s][2] : ""; }
// A run's steps by phase: [[phase id, label, [step rows]]], empty phases left out.
function byPhase(steps) {
  return S.fields.phases.map(([id, label]) => [id, label, steps.filter(x => (S.fields.step_ui[x.name] || [])[1] === id)])
    .filter(p => p[2].length);
}
function phaseState(rows, r) {
  if (r && rows.some(x => x.name === r.step)) return "running";
  if (rows.some(x => ["missing", "failed"].includes(x.status))) return "bad";
  if (rows.some(x => x.status === "gate")) return "gate";
  return rows.every(x => ["done", "skipped"].includes(x.status)) ? "done" : "";
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function img(path, cls="") { return path ? `<img class="zoom ${cls}" src="/img?path=${encodeURIComponent(path)}&t=${S.detailAt}" onclick="zoom(this.src)">` : ""; }
function zoom(src) { document.getElementById("lbimg").src = src; document.getElementById("lb").style.display = "flex"; }
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block";
                      setTimeout(() => t.style.display = "none", 9000); }
async function api(path, body) {
  const r = await fetch(path, body ? { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function cur() { return S.state && S.sel ? S.state.outfits.find(o => o.character + "/" + o.outfit === S.sel) : null; }
function running(key) { return S.state ? S.state.jobs.running.find(j => j.outfit === key) : null; }

async function refresh() {
  try { S.state = await api("/api/state"); await fieldsTable(); } catch (e) { return; }
  drawHeader(); drawNav();
  const o = cur();
  if (S.form || S.charPage) return;                     // a settings form or a character page: leave it alone
  if (o) {
    const r = running(S.sel);
    const stale = Date.now() - (S.fetchedAt || 0) > (r ? 2500 : 6000);
    if (!S.detail || stale || S.lastRun !== !!r) { S.fetchedAt = Date.now(); await loadDetail(); S.lastRun = !!r; }
    else drawLog();
  }
}
setInterval(refresh, 2000);

function drawHeader() {
  const k = S.state.keys;
  document.getElementById("keys").innerHTML = Object.entries({openai:"OpenAI", leonardo:"Leonardo", hf:"HF"}).map(([n, l]) =>
    `<span class="key ${k[n] ? "on" : "off"}">${l} ${k[n] ? "set" : "–"}</span> <button onclick="setKey('${n}')" title="copy the key first">from clipboard</button>`).join(" ");
  const p = S.state.pod, st = p.status;
  let info = p.host ? `${p.host}:${p.port}` : "no pod";
  if (st && !st.error) info += ` · GPU ${st.gpu_pct}% · ${Math.round(st.mem_mb / 1024)}/${Math.round(st.mem_total_mb / 1024)} GB · running: ${st.running.join(", ") || "nothing"} · installed: ${st.installed.join(", ") || "nothing"}`;
  else if (st && st.error) info += ` · <span class="err">${esc(st.error)}</span>`;
  document.getElementById("podinfo").innerHTML = info;
  const podBusy = S.state.jobs.running.some(j => j.lane === "pod");
  document.getElementById("stop").style.display = p.host && !podBusy ? "inline-block" : "none";
}
setInterval(async () => { if (S.state && S.state.pod.host) { try { await api("/api/pod/status"); } catch (e) {} } }, 10000);

function drawNav() {
  // One block per character: its name, its settings and new-outfit buttons, then its outfits by name.
  const chars = [...new Set([...(S.state.characters || []), ...S.state.outfits.map(o => o.character)])].sort();
  document.getElementById("nav").innerHTML = `<div class="row"><button onclick="newCharacter()">New character</button></div>` +
    chars.map(c => `<div class="char"><div class="row"><b onclick="charPage('${c}')" title="the character's page">${esc(c)}</b>
      <button onclick="newOutfit('${c}')">+ outfit</button></div>` +
      S.state.outfits.filter(o => o.character === c).map(o => {
        const key = o.character + "/" + o.outfit, r = running(key);
        const click = o.error ? `editBroken('${o.character}', '${o.outfit}')` : `select('${key}')`;
        return `<div class="outfit ${key === S.sel ? "sel" : ""}" onclick="${click}">
          <div class="name">${esc(o.outfit)}</div><div class="kind">${esc(kindName(o.kind))}${o.next ? " · next: " + esc(stepName(o.next)) : o.steps.length ? " · all done" : ""}</div>
          ${o.error ? `<div class="err" style="font-size:12px">${esc(o.error)}</div>` : ""}
          <div class="phases">${byPhase(o.steps).map(([id, label, rows]) => {
            const n = rows.filter(x => ["done", "skipped"].includes(x.status)).length;
            return `<span class="ph ${phaseState(rows, r)}" title="${rows.map(x => stepName(x.name) + ": " + x.status).join("\n")}">${label} ${n}/${rows.length}</span>`;
          }).join("")}</div></div>`;
      }).join("") + `</div>`).join("");
}
async function select(key) { S.form = null; S.charPage = null; S.sel = key; S.step = null; S.detail = null; S.sig = null; await loadDetail(); }
async function loadDetail() {
  const o = cur(); if (!o) return;
  let d;
  try { d = await api(`/api/run?character=${o.character}&outfit=${o.outfit}`); } catch (e) { toast(e.message); return; }
  if (!S.step) S.step = o.next || o.steps[o.steps.length - 1].name;
  // Redraw only when something changed: a redraw would wipe what is being typed in a retry box.
  const r = running(S.sel), sig = JSON.stringify([d, o.steps, r ? r.step : null, S.step, S.state.jobs.running.map(j => j.lane)]);
  S.detail = d;
  if (sig === S.sig) return drawLog();
  S.sig = sig; S.detailAt = Date.now();
  drawMain();
}
function pickStep(s) { S.step = s; S.sig = null; history.replaceState(null, "", "#" + S.sel + "/" + s); drawMain(); }

async function act(body) {
  const o = cur();
  try { const r = await api("/api/do", Object.assign({ character:o.character, outfit:o.outfit }, body)); S.logStep = null; }
  catch (e) { toast(e.message); }
  await refresh();
}
async function setKey(n) { try { await api("/api/key", { name:n }); } catch (e) { toast(e.message); } refresh(); }
async function setPod() {
  const line = document.getElementById("podline").value.trim(); if (!line) return;
  const m = line.match(/^(\d+\.\d+\.\d+\.\d+)[: ](\d+)$/);
  document.getElementById("podinfo").textContent = "asking the pod for its address…";
  try { await api("/api/pod", m ? { host:m[1], port:m[2] } : { line }); await api("/api/pod/status"); }
  catch (e) { toast(e.message); }
  refresh();
}

function drawMain() {
  const o = cur(), d = S.detail; if (!o || !d) return;
  const key = o.character + "/" + o.outfit, r = running(key), s = o.steps.find(x => x.name === S.step);
  let h = `<h2>${esc(o.outfit)} <span class="tag" title="${esc(S.fields.kind_ui[o.kind][1])}">${esc(kindName(o.kind))}</span>
    <span class="dim" style="font-size:13px; font-weight:400">of <a href="#" onclick="charPage('${o.character}'); return false" style="color:inherit">${esc(o.character)}</a></span>
    <span style="font-size:13px; font-weight:400"><button onclick="editSettings('outfit')">Outfit settings</button></span></h2>
    <div class="dim">${esc(S.fields.kind_ui[o.kind][1])}</div><div class="dim">${esc(o.about)}</div>`;
  if (o.missing && o.missing.length) {
    h += `<div class="attempt"><b>Still to fill in</b> <span class="dim">(each is asked for when its step runs)</span>: ` +
      o.missing.map(m => `${m.field} <span class="dim">(${m.level}; ${m.steps.join(", ")})</span>`).join(" · ") + `</div>`;
  }
  if (o.kind !== "cut") {
    h += `<h3>TRELLIS models</h3><div class="row">` + d.all_models.map(m =>
      `<label><input type="checkbox" class="mdl" value="${m}" ${d.models.includes(m) ? "checked" : ""}> ${LABEL[m]}</label>`).join("") +
      `<button onclick="saveModels()">Save</button></div>`;
    // The views the models need: your image (from Outfit settings > images), the accepted cut-out, or drawn.
    h += `<div class="row" style="align-items:flex-start">` + d.views.map(v => {
      // done: the gate's cut-out, else the step's recorded drawing (outfits backfilled from before the driver)
      const mine = o.images[v], cut = d.cutouts[v] || ((d.run.steps[v] || {}).outputs || {}).draw
        || ((d.run.steps.sides || {}).outputs || {})[v];
      const how = mine ? "your image" : (v in d.mirror_of && d.mirror_right ? "mirrored from " + d.mirror_of[v] : "drawn from the prompt");
      return `<div style="text-align:center"><b>${v}</b><br>${cut ? img(cut, "thumb") : mine ? thumbImg(mine) : `<div class="dim" style="height:120px;width:80px"></div>`}<br>
        <span class="dim">${how}${cut ? " · done" : ""}</span></div>`;
    }).join("") + `</div><div class="dim">Give your own images in Outfit settings → images; views without one are drawn.</div>`;
  }
  h += `<div style="margin:12px 0">` + byPhase(o.steps).map(([id, label, rows]) => `<div class="phase"><div class="dim">${label}</div><div class="chips">` +
    rows.map(x => `<span class="chip ${r && r.step === x.name ? "running" : x.status} ${x.name === S.step ? "sel" : ""}" title="${esc(stepHelp(x.name))} (step ${x.name})" onclick="pickStep('${x.name}')">${esc(stepName(x.name))}</span>`).join("") +
    `</div></div>`).join("") + `</div>`;
  const busy = !!r, laneBusy = S.state.jobs.running.some(j => j.lane === (POD_STEPS.has(S.step) ? "pod" : "local"));
  h += `<div class="row"><b>${esc(stepName(S.step))}</b> <span class="${s.status === "done" ? "okc" : s.status === "gate" ? "gatec" : "dim"}">${s.status}</span>
        ${s.cost_usd ? `<span class="dim">$${s.cost_usd}</span>` : ""} ${s.pod_minutes ? `<span class="dim">${s.pod_minutes} pod min</span>` : ""}
        <button class="main" ${busy || laneBusy ? "disabled" : ""} onclick="act({action:'run', step:'${S.step}'})">Run ${esc(stepName(S.step))}${POD_STEPS.has(S.step) ? " (pod)" : ""}</button>
        ${o.next ? `<button ${busy ? "disabled" : ""} onclick="act({action:'on'})" title="from ${esc(stepName(o.next))} until a gate, a failed step or a pod / local switch">Run on from ${esc(stepName(o.next))}</button>` : ""}
        ${busy ? `<span class="dim">running: ${esc(r.label)}</span>` : ""}</div>
        <div class="dim">${esc(stepHelp(S.step))} <span style="opacity:.6">(step ${S.step})</span></div>`;
  h += panel(S.step, d, busy);
  h += `<h3>Log</h3><pre id="log"></pre>`;
  document.getElementById("main").innerHTML = h;
  drawLog();
}
async function saveModels() {
  const models = [...document.querySelectorAll(".mdl:checked")].map(x => x.value);
  await act({ action:"models", models });
  setTimeout(loadDetail, 1500);
}

function retryForm(step, view, attempt) {
  const id = `${step}_${view || ""}`;
  return `<div class="row"><select id="rk_${id}"><option value="r">r (redraw)</option>${step === "sides" ? "" : `<option value="r1">r1 (show its error)</option>`}${step === "front" ? `<option value="rb">rb (bigger armour)</option>` : ""}</select>
    <input type="text" id="rw_${id}" size="50" placeholder="why (optional): what to fix">
    <input type="file" id="rf_${id}" accept="image/png,image/jpeg">
    <button onclick="retry('${step}', '${view || ""}')">Redraw</button></div>
    <div class="row"><span class="dim">or use an image you have (checked like a drawing, then Accept):</span>
    <input type="file" id="uf_${id}" accept="image/png,image/jpeg,image/webp">
    <button onclick="useImage('${step}', '${view || ""}')">Use this image</button></div>`;
}
async function useImage(step, view) {
  const o = cur(), f = document.getElementById(`uf_${step}_${view}`).files[0];
  if (!f) return toast("choose an image first");
  const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(f); });
  try {
    const up = await api("/api/upload", { character:o.character, input:true, name:f.name, data });
    act({ action:"use", step, view: view || undefined, image:up.path });
  } catch (e) { toast(e.message); }
}
async function retry(step, view) {
  const id = `${step}_${view}`, o = cur();
  let r = document.getElementById("rk_" + id).value, why = document.getElementById("rw_" + id).value.trim();
  const f = document.getElementById("rf_" + id).files[0];
  if (why) r += " " + why;
  if (f) {
    if (!why && r === "r") r += " see the attached image";
    const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(f); });
    try { const up = await api("/api/upload", { character:o.character, outfit:o.outfit, name:f.name, data }); r += " @" + up.path; }
    catch (e) { return toast(e.message); }
  }
  act({ action:"retry", step, view: view || undefined, retry:r });
}
function attempts(step, view, g, busy) {
  if (!g || !g.attempts.length) return `<p class="dim">No drawing yet: Run draws one.</p>`;
  return [...g.attempts].reverse().map(t => {
    const sc = t.scores || {}, acc = g.accepted === t.attempt;
    const bits = sc.iou !== undefined ? `IoU ${sc.iou.toFixed(3)} · missing ${(100 * sc.missing).toFixed(2)} % · spilled ${(100 * sc.spilled).toFixed(2)} %` : "";
    return `<div class="attempt ${acc ? "acc" : ""}"><div class="row"><b>attempt ${t.attempt}</b> ${acc ? `<span class="okc">accepted</span>` : ""}
      <span class="dim">${bits}${sc.passed !== undefined ? (sc.passed ? " · PASS" : " · FAIL") : ""}</span>
      ${acc ? "" : `<button class="main" ${busy ? "disabled" : ""} onclick="act({action:'accept', step:'${step}', view:${view ? `'${view}'` : "undefined"}, n:${t.attempt}})">Accept ${t.attempt}</button>`}</div>
      ${img(t.sheet || t.draw)}</div>`;
  }).join("");
}

function panel(step, d, busy) {
  const run = d.run.steps[step] || {};
  if (step === "front" || step === "back") {
    const g = d.gates[step];
    if (!g && run.status === "done" && (run.outputs || {}).draw)   // made before the driver (backfilled): no gate file here
      return `<p class="dim">Done before the pipeline (backfilled).</p>` + img(run.outputs.draw, "thumb");
    return (g && g.status === "accepted" ? "" : retryForm(step, null)) + attempts(step, null, g, busy);
  }
  if (step === "sides") {
    const need = d.views.filter(v => !["front", "back"].includes(v));
    if (!need.length) return `<p class="dim">The chosen models need no side views.</p>`;
    const strip = ["front", "back", ...need].filter(v => d.cutouts[v]).map(v =>
      `<div style="text-align:center">${img(d.cutouts[v])}<div class="dim">${v}</div></div>`).join("");
    return `<div class="grid" style="grid-template-columns:repeat(8, 1fr)">${strip}</div>` + need.map(v => {
      const mir = d.mirror_right && d.mirror_of[v];
      const g = d.gates["side_" + v];
      let h = `<h3>${v} ${d.cutouts[v] ? `<span class="okc">done</span>` : `<span class="gatec">to do</span>`}</h3>`;
      if (mir) return h + `<p class="dim">The ${d.mirror_of[v]} view mirrored (Run Sides & 3/4 writes it).</p>`;
      if (d.cutouts[v] && !(g && g.attempts.length)) return h + `<p class="dim">Accepted earlier (one gate file for every side then).</p>`;
      return h + (d.cutouts[v] ? "" : retryForm("sides", v)) + attempts("sides", v, g, busy);
    }).join("");
  }
  if (step === "trellis") {
    const made = Object.keys(d.trellis), picked = run.picked;
    let h = `<p>Built: ${made.map(m => LABEL[m]).join(", ") || "none"}${picked ? ` · <span class="okc">picked ${LABEL[picked]}</span>` : ""}</p>`;
    h += `<div class="row">` + d.models.filter(m => made.includes(m)).map(m =>
      `<button class="${picked === m ? "" : "main"}" ${busy ? "disabled" : ""} onclick="act({action:'pick', step:'trellis', model:'${m}'})">Pick ${LABEL[m]}</button>`).join("") + `</div>`;
    return h + (d.images.trellis_sheet ? img(d.images.trellis_sheet, "big") : `<p class="dim">No sheet yet: Run 3D model (pod) builds the ticked models and the sheet.</p>`);
  }
  if (step === "paint") {
    let h = `<div class="row"><button class="main" ${busy ? "disabled" : ""} onclick="act({action:'accept', step:'paint', n:1})">Accept paint</button>
      <input type="text" id="redo" size="40" placeholder="views to repaint, e.g. pelvis_front pelvis_back">
      <button ${busy ? "disabled" : ""} onclick="act({action:'redo', step:'paint', views:document.getElementById('redo').value.split(/[\\s,]+/).filter(Boolean)})">Repaint</button></div>`;
    return h + `<div class="grid">${d.paint.map(p => img(p)).join("")}</div>`;
  }
  if (step === "install") return installPanel(d, run, busy);
  const pics = { cut:["cut_front", "cut_back", "cut_sheet"], merge:["cut_front", "cut_back"], worn:["worn"],
                 slots:["slots_sheet"], sheet:["slots_sheet"] }[step] || [];
  let h = pics.filter(k => d.images[k]).map(k => img(d.images[k], "big")).join("");
  if (step === "export" && run.result) h += `<pre>${esc(run.result)}</pre>`;
  if (step === "skeleton" && run.outputs) h += `<pre>${esc(JSON.stringify(run.outputs, null, 1))}</pre>`;
  return h || `<p class="dim">${run.status === "done" ? "Done." : "Run it."}</p>`;
}

// --- install: the hero entry (body) or the pieces' stats (armour, cut) --------------------------------------------
function installPanel(d, run, busy) {
  if (d.kind === "body") {
    if (!run.entry) return `<p class="dim">Run install: it shows the hero entry for PlayerSelectionDict.json.</p>`;
    let h = `<pre>${esc(JSON.stringify(run.entry, null, 1))}</pre>`;
    if (run.status === "gate") h += `<div class="row"><button class="main" ${busy ? "disabled" : ""} onclick="act({action:'accept', step:'install', n:1})">Write it to PlayerSelectionDict.json</button>
      <span class="dim">Start gear: the outfit settings' start_equipment.</span></div>`;
    return h + (run.note ? `<p class="dim">${esc(run.note)}</p>` : "");
  }
  if (run.items && run.status === "done") return `<p class="okc">Installed: ${run.items.map(esc).join(", ")}</p>`;
  const missing = run.missing_bases || [];
  if (!missing.length) return `<p class="dim">Run install: it checks every piece has stats (item_bases.json), then puts the packs, icons and items in the game.</p>`;
  setTimeout(() => basesForm(missing), 0);
  return `<h3>Stats for the new pieces</h3><p class="dim">Each piece names a base (left and right share one). First numbers; the item card and combat read them.</p><div id="bases"></div>`;
}
async function basesForm(missing) {
  const el = document.getElementById("bases"); if (!el || el.dataset.for === missing.join()) return;
  el.dataset.for = missing.join();
  const P = await api("/api/item_properties"), known = Object.keys(P.bases);
  let h = `<div class="row"><span class="dim">Start each from</span> <select id="b_from"><option value="">blank</option>${known.map(k => `<option>${k}</option>`).join("")}</select>
    <button onclick="fillBases()">Fill</button></div>`;
  for (const b of missing) {
    h += `<div class="attempt"><b>${esc(b)}</b><div class="grid" style="grid-template-columns:repeat(3, 1fr)">`;
    h += P.identity.map(k => `<label>${k} <input type="text" id="b_${b}_${k}" size="24"></label>`).join("");
    h += P.properties.map(p => p.format === "list"
      ? `<label>${p.label} <span class="dim">(${P.regions.join(", ")})</span> <input type="text" id="b_${b}_${p.id}" size="30"></label>`
      : p.format === "yes-no" ? `<label>${p.label} <select id="b_${b}_${p.id}"><option>false</option><option>true</option></select></label>`
      : `<label>${p.label}${p.format === "percent" ? " (0-1)" : ""} <input type="number" step="any" id="b_${b}_${p.id}" style="width:90px"></label>`).join("");
    h += `</div></div>`;
  }
  h += `<div class="row"><button class="main" onclick="saveBases()">Save stats</button> <span class="dim">then Run install</span></div><pre id="baseserr" class="err" style="display:none"></pre>`;
  el.innerHTML = h;

}
function fillBases() {
  const P = S.basesP, from = P.bases[document.getElementById("b_from").value]; if (!from) return;
  for (const b of S.basesMissing) for (const [k, v] of Object.entries(from)) {
    const el = document.getElementById(`b_${b}_${k}`); if (!el) continue;
    el.value = Array.isArray(v) ? v.join(", ") : String(v ?? "");
  }
}
async function saveBases() {
  const P = S.basesP, bases = {};
  for (const b of S.basesMissing) {
    const base = {};
    for (const k of P.identity) { const v = document.getElementById(`b_${b}_${k}`).value.trim(); if (v) base[k] = v; }
    for (const p of P.properties) {
      const v = document.getElementById(`b_${b}_${p.id}`).value.trim(); if (v === "") continue;
      base[p.id] = p.format === "list" ? v.split(",").map(x => x.trim()).filter(Boolean) : p.format === "yes-no" ? v === "true" : Number(v);
    }
    bases[b] = base;
  }
  const err = document.getElementById("baseserr");
  try { await api("/api/bases", { bases }); err.style.display = "none"; toast("stats saved: Run install"); }
  catch (e) { err.textContent = e.message.split("; ").join("\n"); err.style.display = "block"; }
}

async function drawLog() {
  const el = document.getElementById("log"); if (!el) return;
  const o = cur(), r = running(S.sel);
  let lines;
  if (r) lines = r.lines;
  else {
    const last = S.state.jobs.done.find(j => j.outfit === S.sel && (j.step === S.step || j.step === null));
    if (last && Date.now() / 1000 - last.ended < 600) lines = last.lines;
    else {
      if (S.logStep === S.step + S.detailAt) return;
      try { lines = (await api(`/api/log?character=${o.character}&outfit=${o.outfit}&step=${S.step}`)).lines; } catch (e) { lines = []; }
      S.logStep = S.step + S.detailAt;
    }
  }
  const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
  el.textContent = (lines || []).join("\n") || "(no log yet)";
  if (atEnd) el.scrollTop = el.scrollHeight;
}

const FIRST = ["kind", "trellis_models", "images"];        // an outfit form starts with what it is and its images
// The fields this form shows: a character's, or the outfit fields its kind's steps read (and any already set).
function formRows() {
  const F = S.form, kind = F.data.kind || "armour", steps = S.fields.kind_steps[kind] || [];
  const rows = S.fields.fields.filter(f => f.name !== "character" && (F.level === "character" ? f.level === "character"
    : f.name in F.data || (f.level === "outfit" && f.name !== "existing" && (!f.steps.length || f.steps.some(x => steps.includes(x))))));
  const rank = f => FIRST.includes(f.name) ? FIRST.indexOf(f.name) : FIRST.length;
  return rows.map((f, i) => [rank(f), i, f]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
}
// Which heading a field goes under: the phase of the first step that reads it (trellis_models: with the views it decides).
function fieldPhase(f) {
  if (S.form.level === "character") return S.fields.character_phase[f.name] || "game";
  if (f.name === "trellis_models") return "views";
  const steps = S.fields.kind_steps[S.form.data.kind || "armour"] || [];
  const first = f.steps.find(x => steps.includes(x)) || f.steps[0];
  return first ? S.fields.step_ui[first][1] : "general";
}

      <select onfocus="fillFiles(this, '${f.type}')" onchange="if (this.value) { document.getElementById('${id}').value = this.value; thumb('${f.name}', '${f.type}'); }"><option value="">pick a file…</option></select>
      <label class="dim">or upload <input type="file" onchange="uploadInput(this, '${f.name}', '${f.type}')"></label>
      <span id="th_${f.name}">${f.type === "image" && v ? thumbImg(v) : ""}</span>`;
  } else if (f.name === "kind") {                         // what the outfit is: one card per kind
    input = `<input type="hidden" id="${id}" value="${esc(v || "armour")}"><div class="kinds">` + f.choices.map(k =>
      `<div class="kindcard ${k === (v || "armour") ? "sel" : ""}" onclick="keepForm(); S.form.data.kind = '${k}'; drawForm()">
        <b>${esc(kindName(k))}</b> <span class="dim" style="font-size:11px">(${k})</span><br><span class="dim">${esc(S.fields.kind_ui[k][1])}</span></div>`).join("") + `</div>`;
  } else if (f.type === "choice") {

  } else if (f.type === "list" && f.choices.length) {
    const on = f.name === "trellis_models" ? ` onchange="keepForm(); drawForm()"` : "";
    input = f.choices.map(c => `<label><input type="checkbox" class="${id}" value="${c}" ${(v || []).includes(c) ? "checked" : ""}${on}> ${LABEL[c] || c}</label>`).join(" ");
  } else if (f.type === "list") {

function collect() {
  const F = S.form, out = {};
  for (const [k, v] of Object.entries(F.data)) if (isNote(k) && k !== "_about") out[k] = v;   // other notes kept
  const about = document.getElementById("f__about").value.trim();
  if (about) out._about = about;
  for (const f of formRows()) {
    if (f.type === "views") {
      const got = {};
      for (const view of f.choices) {
        const el = document.getElementById("f_images__" + view), s = el ? el.value.trim() : "";
        if (s) got[view] = s;
      }
      if (Object.keys(got).length) out[f.name] = got;
      continue;
    }
    if (f.type === "list" && f.choices.length) {
      const ticked = [...document.querySelectorAll(".f_" + f.name + ":checked")].map(x => x.value);
      if (ticked.length) out[f.name] = ticked;
      continue;
    }
    const el = document.getElementById("f_" + f.name); if (!el) continue;
    const s = el.value.trim(); if (s === "") continue;
    if (f.type === "number") out[f.name] = Number(s);
    else if (f.type === "bool") out[f.name] = s === "true";
    else if (f.type === "dict") {
      try { out[f.name] = JSON.parse(s); } catch (e) { throw new Error(`${f.name}: not valid JSON (${e.message})`); }
    }
    else if (f.type === "list") out[f.name] = s.split(",").map(x => x.trim()).filter(Boolean);
    else out[f.name] = s;
  }
  return out;
}
// Keep what is typed when the form is redrawn (a kind change hides fields: their values are kept, not lost).
function keepForm() {
  keepNames();
  try {
    const d = { ...S.form.data };
    for (const f of formRows()) delete d[f.name];
    S.form.data = Object.assign(d, collect());
  } catch (e) {}
}
async function saveForm() {
  const F = S.form, err = document.getElementById("formerr");
  keepNames();
  try {
    const data = collect();
    if (F.level === "outfit" && !data.pack) data.pack = F.character + "_" + F.outfit;
    if (F.isNew) {                                         // never over another one's file
      const cfg = await api("/api/config");
      if (F.level === "character" ? F.character in cfg.characters : (cfg.characters[F.character] || []).includes(F.outfit))
        throw new Error(`${F.character}${F.level === "outfit" ? "/" + F.outfit : ""} already exists`);
    }
    if (F.level === "character") await api("/api/character", { character:F.character, data });
    else await api("/api/outfit", { character:F.character, outfit:F.outfit, data });
  } catch (e) {
    err.textContent = e.message.split("; ").join("\n"); err.style.display = "block";
    return;
  }
  const key = F.outfit ? F.character + "/" + F.outfit : null, newChar = F.isNew && F.level === "character";
  S.form = null;
  await refresh();
  if (newChar) return newOutfit(F.character, "body");      // a new character: its first outfit, its body
  if (key && S.state.outfits.some(o => o.character + "/" + o.outfit === key && !o.error)) await select(key);
  else drawNav();
}

// #<character>/<outfit>/<step> opens that outfit at that step; #settings/<character>[/<outfit>] its settings form
(async () => {
  await refresh();
  const h = decodeURIComponent(location.hash.slice(1)).split("/");
  if (h[0] === "settings" && h[1]) {                    // #settings/<character>[/<outfit>]: its settings form
    const cfg = await api(`/api/config?character=${h[1]}${h[2] ? "&outfit=" + h[2] : ""}`);
    if (h[2]) S.sel = h[1] + "/" + h[2];
    return openForm({ level: h[2] ? "outfit" : "character", character:h[1], outfit:h[2],
                      data: (h[2] ? cfg.outfit : cfg.character) || {} });
  }
  if (h[0] === "new") return h[1] ? newOutfit(h[1]) : newCharacter();   // #new: a character; #new/<character>: an outfit
  if (h[0] === "character" && h[1]) return charPage(h[1]);              // #character/<c>: its page
  if (h.length >= 2) { await select(h[0] + "/" + h[1]); if (h[2]) pickStep(h[2]); }
})();
</script>
