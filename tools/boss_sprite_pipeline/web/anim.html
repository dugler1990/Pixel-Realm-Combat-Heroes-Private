<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animations</title>
<style>
  :root { --bg:#14141a; --panel:#1c1e26; --line:#2c3140; --text:#e6e8ee; --dim:#9aa1ad; --hi:#7ec8ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:grid;
         grid-template-rows:auto 1fr auto; }
  header, footer { display:flex; gap:10px; align-items:center; padding:8px 12px; background:var(--panel);
                   border-bottom:1px solid var(--line); flex-wrap:wrap; }
  footer { border-bottom:0; border-top:1px solid var(--line); }
  main { display:grid; grid-template-columns:200px minmax(0,1fr) 240px; min-height:0; }
  #list { overflow:auto; border-right:1px solid var(--line); }
  .clip { padding:6px 10px; cursor:pointer; border-bottom:1px solid #22262f; display:flex; justify-content:space-between; gap:8px; }
  .clip.on { background:#243044; }
  .clip small { color:var(--dim); }
  #views { display:grid; grid-template-columns:1fr 1fr; min-height:0; }
  .view { position:relative; min-height:0; min-width:0; overflow:hidden; }
  .view + .view { border-left:1px solid var(--line); }
  .view canvas { display:block; width:100%; height:100%; }
  .tag { position:absolute; top:8px; left:10px; color:var(--dim); pointer-events:none; }
  #side { overflow:auto; border-left:1px solid var(--line); padding:10px 12px; }
  button, input, select { background:#2a3142; color:var(--text); border:1px solid #3c4458; border-radius:4px;
                          padding:4px 8px; font:inherit; }
  button { cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  label { display:flex; justify-content:space-between; gap:8px; align-items:center; margin:6px 0; color:var(--dim); }
  label input { width:90px; }
  pre { background:#101218; border:1px solid var(--line); border-radius:4px; padding:8px; max-height:180px;
        overflow:auto; white-space:pre-wrap; color:var(--dim); }
  h2 { margin:12px 0 4px; font-size:13px; color:var(--hi); }
  #filter { width:100%; margin:0; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:8px 10px; background:#181b22; }
  #job { color:var(--hi); }
  .small { color:var(--dim); font-size:11px; }
  #bindtab { width:100%; border-collapse:collapse; font-size:12px; }
  #bindtab td { padding:1px 4px; border-bottom:1px solid #22262f; }
  #bindtab tr.inherit td:first-child { color:var(--dim); }
  .bad { color:#ff7b7b; }
  .warn { color:#ffcf6b; }
  .ver { padding:3px 0; border-bottom:1px solid #22262f; }
</style>
</head>
<body>
<header>
  <b>Animations</b>
  <label>character <select id="char"></select></label>
  <span id="count" class="tag" style="position:static"></span>
  <span id="job"></span>
  <button id="stop" style="display:none; background:#5a2630; border-color:#8a3a48">stop</button>
</header>
<main>
  <div id="list"><input id="filter" placeholder="filter"></div>
  <div id="views">
    <div class="view" id="stick"><div class="tag">stick</div></div>
    <div class="view" id="mesh"><div class="tag">mapped</div></div>
  </div>
  <div id="side">
    <h2 id="title">pick a clip</h2>
    <p id="meta"></p>
    <button id="map">map this clip</button>
    <button id="mapall" title="every clip in the list (as filtered), not yet baked on this character's current rig">map all shown</button>
    <button id="mapallpod" title="the same clips, baked on the pod set below, many Blender processes in parallel (a CPU pod is enough)">on pod</button>
    <h2>match</h2>
    <p id="match">—</p>
    <h2>last bake</h2>
    <p id="bake" class="small">—</p>
    <h2>map settings <span id="tmpl" class="small"></span></h2>
    <div id="form"></div>
    <h2>bind per bone</h2>
    <p class="small">tick = bind match on. Grey row = the bone follows "bind default". Angle = how far the bone was off the stick in the last bake of this clip (worst frame); red over 40°.</p>
    <table id="bindtab"></table>
    <button id="save">save</button> <button id="apply">save and rebake</button>
    <h2>rig</h2>
    <div id="rig" class="small"></div>
    <h2>prompt</h2>
    <label>host <input id="host" type="text" style="width:140px" placeholder="pod ip"></label>
    <label>port <input id="port" type="text" style="width:80px" placeholder="22"></label>
    <label title="Blender processes at once on the pod; 0 = half its cores, capped by free memory (2 GB each)">parallel <input id="ppar" type="number" min="0" max="64" value="0" style="width:80px"></label>
    <label>name <input id="pname" type="text" style="width:140px"></label>
    <label>duration <input id="pdur" type="text" style="width:140px" value="1.0 2.5 1.0"></label>
    <textarea id="prompt" rows="4" style="width:100%; background:#101218; color:var(--text); border:1px solid var(--line)"></textarea>
    <button id="gen">generate</button>
    <h2>log</h2>
    <pre id="log"></pre>
  </div>
</main>
<footer>
  <button id="play">pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" style="flex:1">
  <span id="stat"></span>
</footer>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { BVHLoader } from "three/addons/loaders/BVHLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const bvhLoader = new BVHLoader();
const gltfLoader = new GLTFLoader();
const Y = new THREE.Vector3(0, 1, 0);
let state = { clips: [], characters: [], jobs: { running: [], done: [] } };
let current = null;
let playing = true;
const clock = new THREE.Clock();

function pane(el) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14141a);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x303038, 1.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(2, 4, 3);
  scene.add(sun);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  el.appendChild(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 200);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  return { el, scene, renderer, camera, controls, mixer: null, action: null, root: null, grid: null };
}
const stick = pane($("stick"));
const mesh = pane($("mesh"));

function resize(v) {
  const w = v.el.clientWidth, h = v.el.clientHeight;
  if (w < 2 || h < 2) return;
  v.renderer.setSize(w, h, false);
  v.camera.aspect = w / h;
  v.camera.updateProjectionMatrix();
}
function resizeAll() { resize(stick); resize(mesh); }
addEventListener("resize", resizeAll);

function frame(v, obj, fill) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const mid = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z, 0.2) / (fill || 1);
  v.controls.target.copy(mid);
  v.camera.position.set(mid.x + span * 0.8, mid.y + span * 0.35, mid.z + span * 3.2);
  v.camera.near = 0.01;
  v.camera.far = span * 80;
  v.camera.updateProjectionMatrix();
  v.controls.update();
  if (v.grid) v.scene.remove(v.grid);
  v.grid = new THREE.GridHelper(Math.max(span * 4, 2), 16, 0x3a3a48, 0x25252f);
  v.grid.position.y = box.min.y;
  v.scene.add(v.grid);
}

function clearRoot(v) {
  if (v.root) v.scene.remove(v.root);
  v.root = v.mixer = v.action = null;
}

function mannequin(rootBone) {
  const mat = new THREE.MeshBasicMaterial({ color: 0xf0c14a });
  rootBone.traverse((bone) => {
    if (!bone.isBone || bone.name === "Root") return;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(3.5, 8, 6), mat);
    dot.frustumCulled = false;
    bone.add(dot);
    for (const child of bone.children) {
      if (!child.isBone) continue;
      const len = child.position.length();
      if (len < 1e-3) continue;
      const w = Math.max(Math.min(len * 0.22, 6), 1.2);
      const box = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), mat);
      box.frustumCulled = false;
      box.position.copy(child.position).multiplyScalar(0.5);
      const dir = child.position.clone().normalize();
      if (dir.lengthSq() > 0) box.quaternion.setFromUnitVectors(Y, dir);
      bone.add(box);
    }
  });
}

async function showStick(id) {
  clearRoot(stick);
  const parsed = await bvhLoader.loadAsync("/bvh?id=" + encodeURIComponent(id) + "&t=" + Date.now());
  const wrap = new THREE.Group();
  wrap.scale.setScalar(0.01);
  const rootBone = parsed.skeleton.bones[0];
  mannequin(rootBone);
  wrap.add(rootBone);
  stick.scene.add(wrap);
  stick.root = wrap;
  stick.mixer = new THREE.AnimationMixer(wrap);
  stick.action = stick.mixer.clipAction(parsed.clip);
  stick.action.play();
  pose();
  frame(stick, wrap, 1);
  $("stat").textContent = parsed.clip.duration.toFixed(2) + "s";
}

// index entries: {glb, rig, bone_hash, bake} since 2026-11-21; a bare string before (old folders)
function entryGlb(e) { return typeof e === "string" ? e : e && e.glb; }
function entryBase(e) {
  const g = entryGlb(e);
  return g ? g.replace(/\/clips\/[^/]+$/, "/base.glb") : null;
}
function entryFlag(e, ch) {
  if (!e) return "";
  if (typeof e === "string") return "mapped";      // baked before 2026-11-21, old folder
  if (e.bone_hash !== ch.bone_hash || (e.roles_hash && e.roles_hash !== ch.roles_hash)) return "stale";
  if (e.rig !== ch.rig) return "older rig";
  return "mapped";
}

async function showMesh(character, entry) {
  clearRoot(mesh);
  const glbPath = entryGlb(entry);
  const basePath = entryBase(entry);
  const base = await gltfLoader.loadAsync("/glb?path=" + encodeURIComponent(basePath));
  mesh.root = base.scene;
  base.scene.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  mesh.scene.add(base.scene);
  const clipFile = await gltfLoader.loadAsync("/glb?path=" + encodeURIComponent(glbPath));
  // the clip's own animation by name: files written by a batch before 2026-11-21 23:00 hold every
  // action of their batch, and [0] was the same clip for all of them
  const want = glbPath.split("/").pop().replace(/\.glb$/, "");
  const clip = clipFile.animations.find((a) => a.name === want) || clipFile.animations[0];
  if (!clip) { $("stat").textContent = "mapped file has no animation"; frame(mesh, base.scene, 0.55); return; }
  mesh.mixer = new THREE.AnimationMixer(base.scene);
  mesh.action = mesh.mixer.clipAction(clip);
  mesh.action.play();
  pose();
  frame(mesh, base.scene, 0.55);
}

function character() {
  return state.characters.find((c) => c.id === $("char").value) || null;
}

function drawList() {
  const q = $("filter").value.toLowerCase();
  const have = $("list");
  [...have.querySelectorAll(".clip")].forEach((n) => n.remove());
  const rows = state.clips.filter((c) => !q || c.id.toLowerCase().includes(q));
  $("count").textContent = rows.length + " / " + state.clips.length;
  for (const c of rows) {
    const el = document.createElement("div");
    el.className = "clip" + (current && current.id === c.id ? " on" : "");
    const ch = character();
    const flag = ch && c.maps ? entryFlag(c.maps[ch.id], ch) : "";
    el.innerHTML = "<span></span><small class='" + (flag === "stale" ? "bad" : flag && flag !== "mapped" ? "warn" : "")
      + "'>" + flag + "</small>";
    el.firstChild.textContent = c.id;
    el.onclick = () => pick(c);
    have.appendChild(el);
  }
}

let showTime = 0;

function pose() {
  for (const v of [stick, mesh]) {
    if (!v.mixer || !v.action) continue;
    const d = v.action.getClip().duration || 1;
    const t = ((showTime % d) + d) % d;
    v.mixer.setTime(t);
  }
}

async function pick(c) {
  showTime = 0;
  current = c;
  drawList();
  $("title").textContent = c.id;
  const bits = [];
  if (c.prompt) bits.push(c.prompt);
  if (c.model) bits.push(c.model);
  if (c.duration) bits.push(c.duration);
  $("meta").textContent = bits.join(" · ");
  const ch = character();
  try {
    await showStick(c.id);
  } catch (err) {
    $("stat").textContent = String(err);
  }
  if (ch && c.maps && entryGlb(c.maps[ch.id])) {
    try { await showMesh(ch, c.maps[ch.id]); }
    catch (err) { $("stat").textContent = String(err); }
  } else {
    clearRoot(mesh);
  }
  if (ch) {
    try {
      const r = await fetch("/api/match?clip=" + encodeURIComponent(c.id) + "&character=" + encodeURIComponent(ch.id));
      const j = await r.json();
      $("match").textContent = r.ok
        ? j.paired + " paired on rig v" + j.rig + " · missing " + (j.missing_required || []).join(", ")
          + (j.static && j.static.length ? " · not driven (static in " + j.source + "): " + j.static.join(", ") : "")
        : (j.error || "no match");
      lastMatch = r.ok ? j : null;
    } catch (err) {
      $("match").textContent = String(err);
    }
    await loadBake();
  }
  drawForm();
}

let lastMatch = null;
let lastBake = null;
let draft = null;          // the map block being edited, per character

async function loadBake() {
  lastBake = null;
  const ch = character();
  if (!current || !ch) { $("bake").textContent = "—"; return; }
  try {
    const r = await fetch("/api/bake?clip=" + encodeURIComponent(current.id) + "&character=" + encodeURIComponent(ch.id));
    lastBake = await r.json();
  } catch (err) { lastBake = null; }
  const b = lastBake;
  if (!b || !b.baked) { $("bake").textContent = "not baked on " + ch.id; return; }
  const pc = b.pose_check || {};
  const w = pc.worst;
  const p = b.proportions || {};
  $("bake").innerHTML = "";
  const line = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; $("bake").appendChild(d); };
  line("rig v" + b.rig + (b.stale ? " — STALE: the rig's bones changed since (now v" + b.current_rig + ")"
    : b.older_rig ? " — older rig (now v" + b.current_rig + ", same bones)" : ""), b.stale ? "bad" : b.older_rig ? "warn" : "");
  if (w) line("pose check " + (pc.fail && pc.fail.length ? "FAIL" : "ok") + ": worst " + w.bone + " " + w.deg + "° (frame " + w.frame + ")",
    pc.fail && pc.fail.length ? "bad" : "");
  if (p.arm_ratio != null) line("proportions: shoulders " + p.shoulder_ratio + " · arms " + p.arm_ratio + " · legs " + p.leg_ratio + " (target / source, over height)");
  line(b.when || "");
}

function field(s, value) {
  const wrap = document.createElement("label");
  wrap.title = s.doc + (s.unit ? " (" + s.unit + ")" : "");
  wrap.append(s.name);
  let input;
  if (s.type === "bool") { input = document.createElement("input"); input.type = "checkbox"; input.checked = !!value; }
  else if (s.type === "choice") {
    input = document.createElement("select");
    for (const c of s.choices) { const o = document.createElement("option"); o.value = o.textContent = c; input.appendChild(o); }
    input.value = value;
  } else {
    input = document.createElement("input");
    input.type = (s.type === "float" || s.type === "int") ? "number" : "text";
    if (s.min != null) input.min = s.min;
    if (s.max != null) input.max = s.max;
    if (input.type === "number") input.step = s.type === "int" ? 1 : 0.05;
    input.value = value;
  }
  input.onchange = () => {
    draft[s.name] = s.type === "bool" ? input.checked : (input.type === "number" ? Number(input.value) : input.value);
    drawForm();
  };
  wrap.appendChild(input);
  return wrap;
}

function drawForm() {
  const ch = character();
  $("form").innerHTML = ""; $("bindtab").innerHTML = ""; $("rig").innerHTML = "";
  if (!ch) return;
  if (!draft || draft._for !== ch.id) draft = Object.assign(JSON.parse(JSON.stringify(ch.map)), { _for: ch.id });
  $("tmpl").textContent = "(from template " + ch.template + ", now this character's own)";
  for (const s of state.schema || []) {
    if (s.type === "roles_bool") continue;
    $("form").appendChild(field(s, draft[s.name]));
  }
  const angles = (lastBake && lastBake.baked && lastBake.pose_check && lastBake.pose_check.by_role) || {};
  const roles = lastMatch ? lastMatch.roles : ch.roles;
  for (const role of roles) {
    const tr = document.createElement("tr");
    const own = draft.bind && Object.prototype.hasOwnProperty.call(draft.bind, role);
    if (!own) tr.className = "inherit";
    const on = own ? draft.bind[role] : draft.bind_default;
    const a = angles[role];
    tr.innerHTML = "<td></td><td><input type=checkbox></td><td></td><td><button title='follow bind default'>×</button></td>";
    tr.children[0].textContent = role;
    const box = tr.querySelector("input");
    box.checked = on;
    box.onchange = () => { draft.bind = Object.assign({}, draft.bind, { [role]: box.checked }); drawForm(); };
    tr.children[2].textContent = a == null ? "" : a + "°";
    if (a != null && a > 40) tr.children[2].className = "bad";
    const reset = tr.querySelector("button");
    reset.disabled = !own;
    reset.onclick = () => { const b = Object.assign({}, draft.bind); delete b[role]; draft.bind = b; drawForm(); };
    $("bindtab").appendChild(tr);
  }
  for (const v of [...ch.versions].reverse()) {
    const d = document.createElement("div");
    d.className = "ver";
    const checks = Object.entries(v.checks || {}).map(([k, c]) => {
      const nums = (c.rules || []).map((r) => r.metric + " " + r.got + (r.pass ? "" : " (want " + r.rule + ")")).join(", ");
      return k + (c.pass ? " ok" : " FAIL") + (nums ? " [" + nums + "]" : "");
    }).join("; ");
    const gatesOk = Object.values(v.checks || {}).every((c) => !c.gate || c.pass);
    const t = document.createElement("span");
    t.textContent = "v" + v.version + (v.version === ch.rig ? " (current)" : "") + " · " + v.step + " · " + v.kind
      + (v.input ? " · from v" + v.input : "") + (v.accepted ? " · accepted" : " · not accepted")
      + (checks ? " · " + checks : "") + (v.note ? " — " + v.note : "") + " ";
    if (!gatesOk) t.className = "bad";
    d.appendChild(t);
    if (v.version !== ch.rig) {
      const b = document.createElement("button");
      b.textContent = v.accepted ? "use" : "accept and use";
      b.disabled = !gatesOk;
      b.title = gatesOk ? "make this the rig every new bake uses; bakes on other bones turn stale" : "a gate check failed";
      b.onclick = async () => {
        try { await post("/api/rig/use", { character: ch.id, version: v.version }); draft = null; await refresh(); drawForm(); }
        catch (err) { $("log").textContent = String(err); }
      };
      d.appendChild(b);
    }
    $("rig").appendChild(d);
  }
  drawStepForm(ch);
}

let stepDraft = {};
function drawStepForm(ch) {
  const box = document.createElement("div");
  box.style.marginTop = "8px";
  const pickStep = document.createElement("select");
  for (const s of state.steps || []) { const o = document.createElement("option"); o.value = o.textContent = s.name; pickStep.appendChild(o); }
  if (stepDraft.step) pickStep.value = stepDraft.step; else stepDraft.step = pickStep.value;
  pickStep.onchange = () => { stepDraft = { step: pickStep.value }; drawForm(); };
  const pickIn = document.createElement("select");
  for (const v of ch.versions) { const o = document.createElement("option"); o.value = v.version; o.textContent = "from v" + v.version; pickIn.appendChild(o); }
  pickIn.value = stepDraft.input || ch.rig;
  pickIn.onchange = () => { stepDraft.input = Number(pickIn.value); };
  const row = document.createElement("label");
  row.append(pickStep, pickIn);
  box.appendChild(row);
  const step = (state.steps || []).find((s) => s.name === stepDraft.step);
  if (step) {
    const doc = document.createElement("div"); doc.className = "small"; doc.textContent = step.doc + " · " + step.kind + " · " + step.lane;
    box.appendChild(doc);
    stepDraft.settings = stepDraft.settings || {};
    for (const s of step.settings) {
      const v = s.name in stepDraft.settings ? stepDraft.settings[s.name] : (s.default == null ? "" : s.default);
      const lab = document.createElement("label");
      lab.title = s.doc;
      lab.append(s.name);
      let input;
      if (s.type === "choice") {
        input = document.createElement("select");
        for (const c of s.choices) { const o = document.createElement("option"); o.value = o.textContent = c; input.appendChild(o); }
        input.value = v;
      } else {
        input = document.createElement("input");
        input.type = s.type === "float" || s.type === "int" ? "number" : "text";
        input.value = typeof v === "object" ? JSON.stringify(v) : v;
        if (s.type === "path" || s.type === "str" || s.type === "roles_map") input.style.width = "140px";
      }
      input.onchange = () => {
        let val = input.value;
        if (s.type === "float" || s.type === "int") val = Number(val);
        if (s.type === "roles_map") { try { val = JSON.parse(val || "{}"); } catch (e) { val = {}; } }
        stepDraft.settings[s.name] = val;
      };
      lab.appendChild(input);
      box.appendChild(lab);
    }
    const go = document.createElement("button");
    go.textContent = "run " + step.name;
    go.onclick = async () => {
      try {
        await post("/api/rig/run", { character: ch.id, step: step.name, input: stepDraft.input || ch.rig, settings: stepDraft.settings });
        $("log").textContent = "rig step started; the new version appears here when it finishes, not yet in use";
      } catch (err) { $("log").textContent = String(err); }
    };
    box.appendChild(go);
  }
  $("rig").appendChild(box);
}

function patchFromDraft() {
  const p = {};
  for (const s of state.schema || []) if (s.name in draft) p[s.name] = draft[s.name];
  // bind is replaced whole: roles missing from the draft go back to following bind_default
  const ch = character();
  const bind = {};
  for (const r of Object.keys(ch.map.bind || {})) bind[r] = null;
  Object.assign(bind, draft.bind || {});
  p.bind = bind;
  return p;
}

let wasRunning = false;

async function refresh() {
  try {
    const j = await (await fetch("/api/state")).json();
    const sameChars = state.characters.map((c) => c.id).join() === j.characters.map((c) => c.id).join();
    state = j;
    if (!sameChars || !$("char").options.length) {
      const prev = $("char").value;
      // characters with bakes first (most first), so the page opens on one that has something to show
      const baked = (id) => j.clips.filter((c) => c.maps && c.maps[id]).length;
      const order = [...j.characters].sort((a, b) => baked(b.id) - baked(a.id) || a.id.localeCompare(b.id));
      $("char").innerHTML = order.map((c) => `<option value="${c.id}">${c.id} (${baked(c.id)} baked)</option>`).join("");
      const want = prev || localStorage.getItem("animChar");
      if (want && order.some((c) => c.id === want)) $("char").value = want;
    }
    drawList();
    if (!sameChars) drawForm();
    const run = j.jobs.running[0];
    const done = j.jobs.done[0];
    if (run) {
      $("job").textContent = run.label + " — running on this machine";
      $("map").textContent = "mapping…";
    } else if (done) {
      $("job").textContent = (done.rc === 0 ? "done" : done.stopped ? "stopped" : "failed") + " · " + done.label;
      $("map").textContent = "map this clip";
    }
    const pose = done && (done.lines || []).find((l) => l.startsWith("pose check:"));
    const head = !run && done ? ((done.rc === 0 ? "finished" : "FAILED") + " " + done.label
      + (pose ? " · " + pose.replace(/ at frame.*/, "") : "")) : "";
    const lines = run ? run.lines : done ? done.lines : [];
    $("log").textContent = [head, ...(lines || [])].filter(Boolean).join("\n");
    $("map").disabled = !!run;
    $("mapall").disabled = !!run;
    $("mapallpod").disabled = !!run;
    $("stop").style.display = run ? "" : "none";
    $("mapall").textContent = "map all shown (" + todo().length + ")";
    $("apply").disabled = !!run;
    $("save").disabled = !!run;
    $("gen").disabled = !!run;
    if (wasRunning && !run) drawForm();
    if (wasRunning && !run && current && character()) {
      const fresh = j.clips.find((c) => c.id === current.id);
      if (fresh) pick(fresh);
    }
    wasRunning = !!run;
  } catch (err) {
    $("job").textContent = String(err);
  }
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

$("filter").oninput = drawList;
$("char").onchange = () => { localStorage.setItem("animChar", $("char").value); draft = null; stepDraft = {}; lastBake = null; lastMatch = null; if (current) pick(current); else { drawList(); drawForm(); } };
$("map").onclick = async () => {
  if (!current || !character()) return;
  $("job").textContent = "starting " + current.id + " → " + character().id;
  $("log").textContent = "Starting on this machine. Blender takes a couple of minutes, and the figure shows up here when it finishes.";
  try { await post("/api/map", { clip: current.id, character: character().id }); }
  catch (err) { $("log").textContent = String(err); $("job").textContent = String(err); }
};
async function saveMap(rebake) {
  const ch = character();
  if (!ch || !draft) return;
  try {
    await post("/api/character", { character: ch.id, patch: patchFromDraft(), clip: rebake && current ? current.id : null });
    draft = null;
    await refresh();
    drawForm();
  } catch (err) { $("log").textContent = String(err); }
}
function todo() {
  const ch = character();
  if (!ch) return [];
  const q = $("filter").value.toLowerCase();
  return state.clips.filter((c) => (!q || c.id.toLowerCase().includes(q))
    && (!c.maps || entryFlag(c.maps[ch.id], ch) !== "mapped" || typeof c.maps[ch.id] === "string"))
    .map((c) => c.id);
}
$("mapall").onclick = async () => {
  const ch = character();
  const ids = todo();
  if (!ch || !ids.length) { $("log").textContent = "nothing to bake: every shown clip is already baked on this rig"; return; }
  if (!confirm("Bake " + ids.length + " clips onto " + ch.id + " (rig v" + ch.rig + ")?")) return;
  try {
    await post("/api/map_all", { character: ch.id, clips: ids });
    $("log").textContent = "baking " + ids.length + " clips in one Blender run; each shows as mapped when the run ends";
  } catch (err) { $("log").textContent = String(err); }
};
$("mapallpod").onclick = async () => {
  const ch = character();
  const ids = todo();
  const host = $("host").value.trim(), port = $("port").value.trim();
  if (!host || !port) { $("log").textContent = "set the pod host and port (prompt section) first"; return; }
  if (!ch || !ids.length) { $("log").textContent = "nothing to bake: every shown clip is already baked on this rig"; return; }
  if (!confirm("Bake " + ids.length + " clips onto " + ch.id + " on the pod " + host + "?")) return;
  try {
    await post("/api/map_all_pod", { character: ch.id, clips: ids, host, port, parallel: Number($("ppar").value) || 0 });
    $("log").textContent = "pod bake started; the first run on a pod installs Blender's Python (several minutes)";
  } catch (err) { $("log").textContent = String(err); }
};
$("stop").onclick = async () => {
  if (!confirm("Stop the running job? Finished chunks of a map-all are kept; the current one is thrown away.")) return;
  try { const r = await post("/api/stop", {}); $("log").textContent = "stopping: " + r.stopped.join(", "); }
  catch (err) { $("log").textContent = String(err); }
};
$("save").onclick = () => saveMap(false);
$("apply").onclick = () => saveMap(true);
$("gen").onclick = async () => {
  try {
    await post("/api/prompt", {
      name: $("pname").value.trim(), prompt: $("prompt").value.trim(),
      duration: $("pdur").value.trim(), host: $("host").value.trim(), port: $("port").value.trim(),
    });
  } catch (err) { $("log").textContent = String(err); }
};
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "pause" : "play"; };
$("scrub").oninput = (e) => {
  const d = stick.action ? stick.action.getClip().duration : 1;
  showTime = (e.target.value / 1000) * d;
  playing = false;
  $("play").textContent = "play";
  pose();
};
addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const q = $("filter").value.toLowerCase();
  const rows = state.clips.filter((c) => !q || c.id.toLowerCase().includes(q));
  const i = rows.findIndex((c) => current && c.id === current.id);
  const n = e.key === "ArrowDown" ? i + 1 : i - 1;
  if (rows[n]) { e.preventDefault(); pick(rows[n]); }
});

function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if (playing) showTime += dt;
  pose();
  if (stick.action) {
    const d = stick.action.getClip().duration || 1;
    const t = ((showTime % d) + d) % d;
    if (document.activeElement !== $("scrub")) $("scrub").value = Math.round((t / d) * 1000);
    $("stat").textContent = t.toFixed(2) + " / " + d.toFixed(2) + "s";
  }
  const pin = new THREE.Vector3();
  const off = new THREE.Vector3();
  for (const v of [stick, mesh]) {
    if (v.root) {
      let hips = null;
      let first = null;
      v.root.traverse((o) => {
        if (!o.isBone) return;
        if (!first) first = o;
        if (!hips && /hip/i.test(o.name)) hips = o;
      });
      (hips || first || v.root).getWorldPosition(pin);
      off.copy(v.camera.position).sub(v.controls.target);
      if (off.lengthSq() > 1e-4) {
        v.controls.target.copy(pin);
        v.camera.position.copy(pin).add(off);
      }
    }
    v.controls.update();
    v.renderer.render(v.scene, v.camera);
  }
}
refresh().then(resizeAll);
setInterval(refresh, 1500);
tick();
</script>
</body>
</html>
